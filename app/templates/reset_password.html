<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareShelf - Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-body">
    <div class="container">
        <!-- Logo Text -->
        <div class="logo-text">
            <img src="{{ url_for('static', filename='library_system_logo.png') }}" alt="ShareShelf Logo" class="logo-image">
            ShareShelf
        </div>
        
        <!-- Reset Password Card -->
        <div class="reset-card">
            <h1 class="reset-title">Reset Your Password</h1>
            <p class="reset-instructions">Enter the email address associated with your account, and we'll send a password reset link if it exists.</p>
            
            <form action="{{ url_for('send_reset_link') }}" method="post" class="reset-form">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon email-icon"></span>
                        <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                </div>

                <!-- Send Reset Link Button -->
                <button type="submit" class="reset-button">
                    Send Reset Link
                    <span class="arrow-icon"></span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareShelf - Register</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="container">
        <!-- Logo Text -->
        <div class="logo-text">
            <img src="library_system_logo.png" alt="ShareShelf Logo" class="logo-image">
            ShareShelf
        </div>
        
        <!-- Register Card -->
        <div class="register-card">
            <h1 class="register-title">Register</h1>
            
            <form class="register-form">
                <!-- Name Fields Row -->
                <div class="name-fields-row">
                    <div class="form-group name-field">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="firstName" name="firstName" placeholder="First name" required>
                        </div>
                    </div>

                    <div class="form-group name-field">
                        <label for="middleName">Middle Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="middleName" name="middleName" placeholder="Middle name">
                        </div>
                    </div>

                    <div class="form-group name-field">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="lastName" name="lastName" placeholder="Last name" required>
                        </div>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon email-icon"></span>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <!-- Phone Number Field -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <span class="input-icon phone-icon"></span>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon lock-icon"></span>
                        <input type="password" id="registerPassword" name="password" placeholder="Enter your password" required>
                        <span class="eye-icon" id="toggleRegisterPassword">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Register Button -->
                <button type="submit" class="register-button">
                    Register
                    <span class="arrow-icon"></span>
                </button>

                <!-- Login Link -->
                <p class="login-text">
                    Already have an account? <a href="login.html" class="login-link">Login</a>
                </p>
            </form>
        </div>
    </div>
</body>
<script>
    const toggleRegisterPassword = document.getElementById('toggleRegisterPassword');
    if (toggleRegisterPassword) {
        toggleRegisterPassword.addEventListener('click', () => {
            const passwordInput = document.getElementById('registerPassword');
            const eyeIcon = toggleRegisterPassword.querySelector('svg');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d=\"M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"></path><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"></line>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle>';
            }
        });
    }
</script>
</html>

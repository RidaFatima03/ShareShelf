<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareShelf - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="container">
        <!-- Logo Text -->
        <div class="logo-text">
            <img src="library_system_logo.png" alt="ShareShelf Logo" class="logo-image">
            ShareShelf
        </div>
        
        <!-- Login Card -->
        <div class="login-card">
            <h1 class="login-title">Login</h1>
            <p class="welcome-message">Welcome! Please enter your details to sign in.</p>
            
            <form class="login-form" action="home.html" method="get">
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon email-icon"></span>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon lock-icon"></span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <span class="eye-icon" id="toggleLoginPassword">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Forgot Password Link -->
                <a href="reset-password.html" class="forgot-password">Forgot Password?</a>

                <!-- Login Button -->
                <button type="submit" class="login-button">
                    Login
                    <span class="arrow-icon"></span>
                </button>

                <!-- Register Link -->
                <p class="register-text">
                    Don't have an account? <a href="register.html" class="register-link">Register</a>
                </p>
            </form>
        </div>
    </div>
</body>
<script>
    const toggleLoginPassword = document.getElementById('toggleLoginPassword');
    if (toggleLoginPassword) {
        toggleLoginPassword.addEventListener('click', () => {
            const passwordInput = document.getElementById('password');
            const eyeIcon = toggleLoginPassword.querySelector('svg');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d=\"M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"></path><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"></line>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle>';
            }
        });
    }
</script>
</html>

{% extends "sidebar.html" %}

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}" style="padding: 15px; margin-bottom: 20px; border-radius: 8px; 
                background-color: {% if category=='success' %}#d4edda{% else %}#f8d7da{% endif %}; 
                color: {% if category=='success' %}#155724{% else %}#721c24{% endif %}; 
                border: 1px solid {% if category=='success' %}#c3e6cb{% else %}#f5c6cb{% endif %};">
            {{ message }}
            </div>
        {% endfor %}
        {% endif %}
    {% endwith %}

{% block content %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar_style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <div class="update-info-content" style="max-width: 1000px; margin: 0 auto;">
        <h1 class="page-title">New Policy</h1>

        <form action="{{ url_for('policy.add_policy') }}" method="POST">
            <div class="form-row">
                <div class="form-column">
                    <div class="form-group">
                        <label>Policy Name</label>
                        <input type="text" name="name" required><br>
                    </div>
                    <div class="form-group">
                        <label>Loan Period (days)</label>
                        <input type="number" name="loan_period_days" required><br>
                    </div>
                    <div class="form-group">
                        <label>Renewals Allowed:</label>
                        <input type="number" name="renewals_allowed" required><br>
                    </div>
                    <div class="form-group">
                        <label>Fine per Day ($):</label>
                        <input type="number" step="0.01" name="fine_per_day" required><br>
                    </div>
                    <div class="form-group">
                        <label>Max Concurrent Loans:</label>
                        <input type="number" name="max_concurrent_loans" required><br>
                    </div>
                    <div class="form-group">
                        <label>Reservation Limit:</label>
                        <input type="number" name="holds_limit_reservation" required><br>
                    </div>
                </div>
            </div>
            <div>
                <button type="submit" class="logout-link btn-new">Save</button>
                <a href="{{ url_for('policy.policy') }}" class="logout-link btn-new">Cancel</a>
            </div>
        </form>
    </div>

{% endblock %}

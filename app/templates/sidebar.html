<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareShelf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <header class="dashboard-header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5c4033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <a href="{{ url_for('main.main_page') }}" class="header-logo-text">
                <img src="{{ url_for('static', filename='library_system_logo.png') }}" alt="ShareShelf Logo" class="header-logo-image">
                ShareShelf
            </a>
        </div>
        <div class="header-right">
            <a href="{{ url_for('auth.logout') }}" class="logout-link">Logout</a>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                
                <a href="{{ url_for('main.library-search') }}" 
                   class="nav-item {% if request.endpoint == 'main.library-search' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>Library Search</span>
                </a>
                
                {% if session.get('user_type') in ['Reader'] %}
                <a href="{{ url_for('main.my_checkouts') }}" 
                   class="nav-item {% if request.endpoint == 'main.my_checkouts' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
                    </svg>
                    <span>My Checkouts</span>
                </a>
                
                <a href="{{ url_for('main.my_fines') }}" 
                   class="nav-item {% if request.endpoint == 'main.my_fines' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    <span>My Fines</span>
                </a>
                
                <a href="{{ url_for('main.my_requests') }}" 
                   class="nav-item {% if request.endpoint == 'main.my_requests' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>My Requests</span>
                </a>
                {% endif %}
                
                <a href="{{ url_for('main.notifications') }}" 
                   class="nav-item {% if request.endpoint == 'main.notifications' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Notifications</span>
                </a>
                
                <a href="{{ url_for('profile.userprofile') }}" 
                   class="nav-item {% if request.endpoint == 'profile.userprofile' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Personal Info</span>
                </a>

                {% if session.get('user_type') == 'Admin' %}
                <a href="{{ url_for('admin.system_logs') }}" class="nav-item">
                    <span>System Logs</span>
                </a>
                <a href="{{ url_for('admin.user_activity') }}" class="nav-item">
                    <span>User Activity</span>
                </a>
                {% endif %}
            </nav>
        </aside>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.querySelector('.main-content');

        if (menuToggle) {
            menuToggle.addEventListener('click', function() {
                sidebar.classList.toggle('sidebar-closed');
                if(mainContent) mainContent.classList.toggle('main-content-expanded');
                
                const filterLayout = document.querySelector('.filters-layout');
                if (filterLayout) filterLayout.classList.toggle('sidebar-closed');
            });
        }

        document.addEventListener('click', function(event) {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                    sidebar.classList.add('sidebar-closed');
                    if(mainContent) mainContent.classList.remove('main-content-expanded');
                }
            }
        });
    </script>
</body>
</html>
